# Local full-stack environment: PostgreSQL + API + web.
#   docker compose up --build
#   docker compose exec -e ALLOW_DEMO_SEED=true backend npx prisma db seed   # optional demo data
# Values here are for LOCAL USE ONLY.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rent_flatmate_finder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rent_flatmate_finder
      JWT_SECRET: local-docker-only-secret-0123456789abcdefghijklmnop
      CORS_ORIGIN: http://localhost:3000
      APP_URL: http://localhost:3000
      TRUST_PROXY: "1"
      # Browsers treat http://localhost as a secure context, so the Secure cookie works locally.
      COOKIE_SAMESITE: lax
      LLM_PROVIDER: none
      EMAIL_PROVIDER: none
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:5000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:5000

volumes:
  pgdata:
  uploads:
