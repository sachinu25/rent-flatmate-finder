# ──────────────────────────────────────────────────────────────────────────────
# Render Blueprint — BACKEND ONLY (Express REST API + Socket.IO).
#
# Production architecture:
#   Frontend  → Vercel           (Next.js; proxies /api/* to this service)
#   Backend   → Render web service (persistent process — required for WebSockets)
#   Database  → Neon PostgreSQL  (set DATABASE_URL; Render's free Postgres expires)
#   Images    → Cloudinary       Email → Resend      AI → OpenAI or Anthropic
#
# `sync: false` values are prompted for in the Render dashboard — never commit them.
# ──────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: rent-flatmate-finder-api
    runtime: node
    rootDir: backend
    plan: free # free instances sleep when idle; use "starter" for always-on chat
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # `npm start` runs `prisma migrate deploy` before booting the server.
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Your Vercel production URL(s), comma-separated, e.g. https://rent-flatmate.vercel.app
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      # Vercel rewrite proxy + Render load balancer = 2 hops.
      - key: TRUST_PROXY
        value: "2"
      - key: COOKIE_SAMESITE
        value: lax
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
